services:
  speech:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HF_HOME: /models
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - whisper-models:/models
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

volumes:
  whisper-models:
